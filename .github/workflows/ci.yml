name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # The typst compiler is most of the build, and most of the minutes: the
      # cache is what keeps a run short.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # --locked throughout: the lockfile is what a clean clone builds from,
      # and one written under a local path patch fails here rather than on
      # the next machine.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release --target wasm32-unknown-unknown
      - run: ls -l target/wasm32-unknown-unknown/release/*.wasm
